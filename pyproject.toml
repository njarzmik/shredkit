[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shredkit"
version = "0.1.0"
description = "Solana Merkle shreds in Python: parse, verify the leader signature, Reed-Solomon recover, deshred to entries and transactions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Norbert Jarzmik" }]
dependencies = ["numpy>=1.24", "cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
shredkit = "shredkit.cli:main"

[tool.setuptools]
packages = ["shredkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
